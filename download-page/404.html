<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better Deen</title>
<link rel="icon" href="/better-deen-app/icon.png">
<style>body{margin:0;background:#06151a;color:#d5e5ec;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}a{color:#ffd47c;margin:0 8px}</style>
<script>
  (function () {
    var langs = ["en", "es", "ar", "nl"];
    var wanted = (navigator.languages || [navigator.language || 'en']);
    var pick = 'en';
    for (var i = 0; i < wanted.length; i++) {
      var l = String(wanted[i]).slice(0, 2).toLowerCase();
      if (langs.indexOf(l) >= 0) { pick = l; break; }
    }
    location.replace('/better-deen-app/' + pick + '/404.html' + location.hash);
  })();
</script>
</head>
<body>
<p><a href="/better-deen-app/en/404.html" hreflang="en">English</a> <a href="/better-deen-app/es/404.html" hreflang="es">Español</a> <a href="/better-deen-app/ar/404.html" hreflang="ar">العربية</a> <a href="/better-deen-app/nl/404.html" hreflang="nl">Nederlands</a></p>
</body>
</html>
