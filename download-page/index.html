<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better Deen</title>
<link rel="icon" href="icon.png">
<style>body{margin:0;background:#03140c;color:#ddf2e6;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}a{color:#6ef2a6;margin:0 8px}</style>
<script>
  (function () {
    var langs = ["en", "es", "ar", "nl"];
    var wanted = (navigator.languages || [navigator.language || 'en']);
    var pick = 'en';
    for (var i = 0; i < wanted.length; i++) {
      var l = String(wanted[i]).slice(0, 2).toLowerCase();
      if (langs.indexOf(l) >= 0) { pick = l; break; }
    }
    location.replace('' + pick + '/index.html' + location.hash);
  })();
</script>
</head>
<body>
<p><a href="en/index.html" hreflang="en">English</a> <a href="es/index.html" hreflang="es">Español</a> <a href="ar/index.html" hreflang="ar">العربية</a> <a href="nl/index.html" hreflang="nl">Nederlands</a></p>
</body>
</html>
